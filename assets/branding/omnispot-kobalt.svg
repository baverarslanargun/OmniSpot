<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" color-interpolation="sRGB">
<title>OmniSpot — Kobalt–camgöbeği</title>
<desc>The approved logo rebuilt with deliberate geometry: nine true squares sharing a 20 percent corner-radius ratio, three flowing ribbons, a smooth O with corrected depth surfaces, and a circular focus. Native continuous gradients, subtle white particle halos, and a localized white focus highlight; no embedded raster images, scanline strips, or textures. Element positions follow the approved reference. The background is pure white.</desc>
