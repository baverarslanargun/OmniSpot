name: CI

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartFileLauncher.sln

      - name: Build
        run: dotnet build SmartFileLauncher.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/SmartFileLauncher.Core.Tests/SmartFileLauncher.Core.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults
